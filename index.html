<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Salmon Flipper</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // pick the theme before the stylesheet paints so a dark visitor never sees a cream flash
      (function () {
        // carry settings and plans over from the app's former name
        [['salmon-cuts:theme', 'salmon-flipper:theme'], ['salmon-cuts:lang', 'salmon-flipper:lang'], ['salmon-cuts-planner:v1', 'salmon-flipper-planner:v1']].forEach(function (k) {
          var old = localStorage.getItem(k[0]);
          if (old !== null && localStorage.getItem(k[1]) === null) localStorage.setItem(k[1], old);
          localStorage.removeItem(k[0]);
        });
        var pref = localStorage.getItem('salmon-flipper:theme');
        var dark = pref === 'dark' || (pref !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
